# Background Opacity (0.0 is fully transparent, 1.0 is fully opaque)
background_opacity 1.00

# Background Blur (Supported on macOS and compatible Linux compositors like KDE/X11 or Hyprland)
background_blur 1

# Enable dynamic opacity changes via keyboard or remote control
dynamic_background_opacity yes


map ctrl+shift+a set_background_opacity +0.05
map ctrl+shift+b set_background_opacity -0.05
